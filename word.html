<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="utf-8">
<title>Word List Project</title>
</head> 
<body>
  <select id="wordSelect" onchange="syncWord()">
    <option value="">-- Choose a Word --</option>
    <option value="Diligent" data-def="Having or showing care in one's work or duties">Diligent</option>
    <option value="Exclusive" data-def="Restricted to the person, group, or area concerned">Exclusive</option>
    <option value="Ambiguous" data-def="Open to more than one interpretation">Ambiguous</option>
    <option value="Tedious" data-def="Too long, slow, or dull">Tedious</option>
    <option value="Impulsive" data-def="Acting or done without forethought">Impulsive</option>
  </select>
  <buttononclick="speakWord()">Speak Word</button>
  <input type="text" id="wordDisplay" readonly style="width:350px;">
  <button onclick="speakSentence()">Speak Sentence</button>
  <script src="word.js"></script>
</body>
</html>
